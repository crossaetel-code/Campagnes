<title>Campagnes scientifiques - Atlantique</title>

<style>
  body { margin:0; font-family:sans-serif; }
  #map { height:100vh; width:100%; }
  #panel { position:absolute; top:10px; left:10px; z-index:1000; background:white;
           padding:10px; border-radius:6px; box-shadow:0 0 8px rgba(0,0,0,.3);
           max-width:340px; max-height:85vh; overflow-y:auto; font-size:13px; }
  input#search { width:95%; padding:5px; margin-bottom:8px; }
  .import-actions { display:flex; flex-direction:column; gap:5px; margin:4px 0 8px; }
  .import-actions button { text-align:left; padding:5px 7px; cursor:pointer; }
  #btnEdition.actif { background:#1565c0; color:#fff; }
  #exportDonneesJSON.alerte { background:#e74c3c; color:#fff; }
  #aideEdition { display:none; margin:0 0 8px; padding:7px; background:#eaf3ff; border-left:3px solid #1565c0; }
  #aideEdition.visible { display:block; }
  .edition-active .leaflet-interactive { cursor:grab; }
  .edition-active .leaflet-interactive:active { cursor:grabbing; }
  .anciennes-campagnes-toggle { display:block; margin:0 0 8px; }
  .campagne { padding:6px; border-bottom:1px solid #ddd; cursor:pointer; }
  .campagne:hover { background:#eef; }
  .campagne b { color:#005; }
  .date { color:#777; font-size:11px; }
  .marker-actif { filter:hue-rotate(90deg); }
  #legend { position:absolute; bottom:10px; right:10px; z-index:1000; background:white;
            padding:8px; border-radius:6px; font-size:12px; box-shadow:0 0 8px rgba(0,0,0,.3);}
</style>
</head>

<div id="map"></div>
<div id="panel">
  <b>Campagnes en mer (maj 12/10/2026)</b>

  <div class="import-actions">
    <input id="csvCampagnes" type="file" accept=".csv,text/csv" hidden>
    <button id="importCampagnes" type="button">Importer CSV - campagnes</button>
    <input id="csvTravaux" type="file" accept=".csv,text/csv" hidden>
    <button id="importTravaux" type="button">Importer CSV – travaux en mer</button>
    <button id="btnEdition" type="button" aria-pressed="false">✏️ Mode édition</button>
    <button id="exportDonneesJSON" type="button">💾 Exporter</button>
    <div id="aideEdition" role="status">Glissez les points à la souris pour les repositionner. Pensez à exporter ensuite.</div>
  </div>
  <label class="anciennes-campagnes-toggle"><input id="afficherAnciennesCampagnes" type="checkbox"> Afficher les anciennes campagnes</label>
  <div id="liste"></div>
</div>
<div id="legend">

(async function demarrerCarte(){
  // Chargement central facultatif : en file://, fetch n’est pas fiable, on conserve les données intégrées.
  if (location.protocol !== "file:") {
    try {
      const reponse = await fetch("donnees.json", {cache:"no-store"});
      if (reponse.ok) {
        const donneesDistantes = await reponse.json();
        if (Array.isArray(donneesDistantes) && donneesDistantes.every(c =>
          c && typeof c === "object" && typeof c.debut === "string" &&
          typeof c.zone === "string" && Array.isArray(c.coords) && c.coords.length === 2 &&
          c.coords.every(Number.isFinite))) {
          DATA = donneesDistantes;
        }
      }
    } catch (_) {
      // Fichier absent, indisponible ou invalide : utiliser les données intégrées sans alerte.
    }
  }

function dateISO(valeur){
  const v = String(valeur ?? "").trim();
  let match = v.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
  if (match){
    const iso = `${match[1]}-${match[2].padStart(2,"0")}-${match[3].padStart(2,"0")}`;
    const d = new Date(`${iso}T00:00:00Z`);
    return !Number.isNaN(d.getTime()) && d.toISOString().slice(0,10) === iso ? iso : "";
  }
  match = v.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if (match){
    const iso = `${match[3]}-${match[2].padStart(2,"0")}-${match[1].padStart(2,"0")}`;
    const d = new Date(`${iso}T00:00:00Z`);
    return !Number.isNaN(d.getTime()) && d.toISOString().slice(0,10) === iso ? iso : "";
  }
  return "";
}
function aujourdHuiISO(){
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}
function statut(c){
  const aujourdhui = aujourdHuiISO();
  if (c.debut > aujourdhui) return "avenir";
  if (!c.fin || c.fin >= aujourdhui) return "encours";
  return "terminee";
}
const COULEURS = {encours:"#2e7d32", avenir:"#1565c0", terminee:"#9e9e9e"};

  if (!marqueurEnCoursEdition) return;
  const c = marqueurEnCoursEdition._donnee;
  const pos = marqueurEnCoursEdition.getLatLng();
  const coords = [Number(pos.lat.toFixed(5)), Number(pos.lng.toFixed(5))];

  c.coords = coords;
  marqueurEnCoursEdition.setPopupContent(construireContenuPopup(c));

function creerMarqueur(c){
  c._statut = statut(c);

  m.on('mousedown', e => {

    map.dragging.disable();

}

function actualiserAffichage(){
  const q = normaliserTexte(recherche.value);
  liste.innerHTML = "";
  DATA.forEach(c => {
    c._statut = statut(c);
    const couleur = COULEURS[c._statut];
    c._marker.setStyle({color:couleur, fillColor:couleur});
    const visibleRecherche = !q || normaliserTexte(`${c.zone} ${c.navire} ${c.obs} ${c.ref}`).includes(q);
    // Les travaux conservent leur règle existante (en cours seulement) ; les anciennes campagnes sont optionnelles.
    const visibleStatut = c.categorie === "travaux"
      ? c._statut === "encours"
      : c._statut !== "terminee" || afficherAnciennesCampagnes.checked;
    if (visibleRecherche && visibleStatut){
      if (!map.hasLayer(c._marker)) c._marker.addTo(map);
      const item = document.createElement('div'); item.className = 'campagne';
      const titre = document.createElement('b'); titre.textContent = `${c.zone} — ${c.navire || "Navire non précisé"}`;

    } else if (map.hasLayer(c._marker)) map.removeLayer(c._marker);
  });
}

// Parse des enregistrements CSV, y compris guillemets doublés et retours à la ligne dans les champs.
function parserCSV(texte, separateur){
  const lignes=[]; let ligne=[], champ="", guillemets=false;
  for (let i=0;i<texte.length;i++){
    const ch=texte[i];
    if (guillemets){
      if (ch==='"' && texte[i+1]==='"'){champ+='"';i++;}
      else if (ch==='"') guillemets=false;
      else champ+=ch;
    } else if (ch==='"' && champ==="") guillemets=true;
    else if (ch===separateur){ligne.push(champ);champ="";}
    else if (ch==='\n' || ch==='\r'){
      if (ch==='\r' && texte[i+1]==='\n') i++;
      ligne.push(champ);lignes.push(ligne);ligne=[];champ="";
    } else champ+=ch;
  }
  if (guillemets) throw new Error("Un champ entre guillemets n’est pas refermé.");
  if (champ!=="" || ligne.length){ligne.push(champ);lignes.push(ligne);}
  return lignes;
}
function cleEntete(v){
  return String(v ?? "").replace(/^\uFEFF/,"").normalize('NFD').replace(/[\u0300-\u036f]/g,"")
    .toLocaleLowerCase('fr').replace(/[^a-z0-9]/g,"");
}
function typeEntete(v){
  const h=cleEntete(v);
  if (h === "debut" || h === "datedebut") return "debut";
  if (h === "fin" || h === "datefin") return "fin";
  if (h === "zone" || h === "secteur") return "zone";
  if (h.startsWith("navire")) return "navire";
  if (h === "objet" || h.startsWith("objet") || h === "obs" || h.startsWith("obs") || h.startsWith("observation")) return "objet";
  if (h === "ref" || h.startsWith("ref") || h.includes("decision") || h.includes("arrete")) return "ref";
  return "";
}
function detecterStructure(texte){
  const candidats=[",",";","\t",":"];
  let meilleur=null;
  for (const sep of candidats){
    let lignes;
    try { lignes=parserCSV(texte,sep); } catch (_) { continue; }
    for (let i=0;i<Math.min(10,lignes.length);i++){
      const types=lignes[i].map(typeEntete);
      const indices={};
      types.forEach((t,j)=>{if(t && indices[t]===undefined) indices[t]=j;});
      const score=Object.keys(indices).length;
      if (indices.debut!==undefined && indices.fin!==undefined && indices.zone!==undefined && indices.navire!==undefined && indices.objet!==undefined && indices.ref!==undefined && (!meilleur || score>meilleur.score))
        meilleur={sep,lignes,entete:i,indices,score};
    }
  }
  if (!meilleur) throw new Error("En-tête introuvable dans les 10 premières lignes (DEBUT, FIN, ZONE, NAVIRE(S), OBJET/OBS, REF/DÉCISIONS/ARRÊTÉS requis).");
  return meilleur;
}
function convertirCSV(texte,categorie){
  const {lignes,entete,indices}=detecterStructure(texte);
  const importees=[]; let ignorees=0;
  for (const vals of lignes.slice(entete+1)){
    if (vals.every(v=>!String(v ?? "").trim())) continue;
    const val=k=>String(vals[indices[k]] ?? "").trim();
    const debut=dateISO(val("debut"));
    const brutFin=val("fin"), fin=brutFin ? dateISO(brutFin) : "";
    if (!debut || (brutFin && !fin)){ignorees++;continue;}
    const latIndex=indices.lat, lonIndex=indices.lon;
    let coords;
    if (latIndex!==undefined && lonIndex!==undefined){
      const lat=Number(String(vals[latIndex] ?? "").replace(",","."));
      const lon=Number(String(vals[lonIndex] ?? "").replace(",","."));
      if (Number.isFinite(lat)&&Number.isFinite(lon)&&lat>=-90&&lat<=90&&lon>=-180&&lon<=180) coords=[lat,lon];
    }
    if (!coords) coords=positionsConnues.get(normaliserTexte(val("zone"))) || [45.8,-2.5];
    importees.push({debut,fin,zone:val("zone"),coords,navire:val("navire"),obs:val("objet"),ref:val("ref"),categorie});
  }
  if (!importees.length) throw new Error("Aucune ligne avec une date valide n’a été trouvée.");
  return {importees,ignorees};
}
function remplacerCategorie(importees,categorie){
  const conserves=DATA.filter(c=>c.categorie!==categorie);
  DATA.filter(c=>c.categorie===categorie).forEach(c=>{if(c._marker && map.hasLayer(c._marker)) map.removeLayer(c._marker);});
  DATA=conserves.concat(importees);
  importees.forEach(creerMarqueur);
  actualiserAffichage();
  const visibles=DATA.filter(c=>map.hasLayer(c._marker));
  if(visibles.length===1) map.setView(visibles[0].coords,Math.max(map.getZoom(),7));
  else if(visibles.length>1) map.fitBounds(L.latLngBounds(visibles.map(c=>c.coords)),{padding:[25,25],maxZoom:9});
}
function brancherImport(boutonId,inputId,categorie){
  const bouton=document.getElementById(boutonId), fichier=document.getElementById(inputId);
  bouton.addEventListener('click',()=>fichier.click());
  fichier.addEventListener('change',()=>{
    const f=fichier.files && fichier.files[0]; if(!f) return;
    const lecteur=new FileReader();
    lecteur.onload=()=>{
      try{
        const {importees,ignorees}=convertirCSV(String(lecteur.result ?? ""),categorie);
        remplacerCategorie(importees,categorie);
        alert(`Import terminé : ${importees.length} ligne(s) chargée(s) dans ${categorie === "campagnes" ? "campagnes scientifiques" : "travaux en mer"}.${ignorees ? ` ${ignorees} ligne(s) ignorée(s) (date invalide ou manquante).` : ""}`);
      } catch(erreur){alert(`Import CSV impossible : ${erreur.message}`);}
      finally{fichier.value="";}
    };
    lecteur.onerror=()=>{alert("Erreur lors de la lecture du fichier CSV.");fichier.value="";};
    lecteur.readAsText(f,'UTF-8');
  });
}
brancherImport('importCampagnes','csvCampagnes','campagnes');
brancherImport('importTravaux','csvTravaux','travaux');
function exporterDonneesJSON(){
  const donneesExportees = DATA.map(c => Object.fromEntries(
    Object.entries(c)
      .filter(([cle]) => !cle.startsWith("_"))
      .map(([cle, valeur]) => [cle, cle === "coords" ? [...valeur] : valeur])
  ));
  const blob = new Blob([JSON.stringify(donneesExportees, null, 2)], {type:"application/json;charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const lien = document.createElement("a");
  lien.href = url;
  lien.download = "donnees.json";
  document.body.appendChild(lien);
  lien.click();
  lien.remove();
  URL.revokeObjectURL(url);
  nonExporte = false;
  actualiserEtatExport();
}
document.getElementById('exportDonneesJSON').addEventListener('click',exporterDonneesJSON);
recherche.addEventListener('input',actualiserAffichage);
afficherAnciennesCampagnes.addEventListener('change',actualiserAffichage);
actualiserAffichage();
})();
